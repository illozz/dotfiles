config_version = 10

[bar.default]
background_opacity = 0.59999998658895493
center = [ "workspaces" ]
end = [ "tray", "notifications", "volume", "battery", "clock" ]
margin_edge = 5
margin_ends = 15
margin_opposite_edge = 5
radius = 10
start = [ "wallhaven", "wallpaper", "cpu", "ram" ]

[dock]
background_opacity = 0.59999998658895493
cross_axis_padding = 5
enabled = true
icon_size = 30
launcher_position = "start"
magnification = false
main_axis_padding = 10
margin_edge = 5
pinned = [ "Alacritty", "brave-origin", "org.kde.dolphin" ]
radius = 10
show_dots = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 618.0
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "noctalia/wallhaven" ]

[theme]
builtin = "Tokyo-Night"

[wallpaper.default]
path = "/home/oli/Pictures/Wallpapers/wallhaven-gwdze7.jpg"

[wallpaper.last]
path = "/home/oli/Pictures/Wallpapers/wallhaven-gwdze7.jpg"

[wallpaper.monitors.Virtual-1]
path = "/home/oli/Pictures/Wallpapers/wallhaven-gwdze7.jpg"

[widget.clock]
format = "{:%H:%M %a, %d.%m.%y}"

[widget.cpu]
show_label = false

[widget.ram]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"